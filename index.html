<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6558e8">
<title>Vida Fácil — Organize sua rotina</title>
<style>
:root{--bg:#f5f6fb;--surface:#fff;--surface2:#f8f9fd;--ink:#20243a;--muted:#858ba2;--line:#eceef4;--brand:#6558e8;--brand2:#8b81f3;--brand-soft:#f0efff;--teal:#20b89a;--red:#e56b78;--amber:#e6a23c;--shadow:0 12px 35px rgba(35,39,75,.055);--radius:19px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}body.dark{--bg:#111827;--surface:#1b2537;--surface2:#222e43;--ink:#edf1fa;--muted:#a0abc0;--line:#2d3a50;--brand:#9a91ff;--brand2:#7165ed;--brand-soft:#302e55;--shadow:0 12px 35px #0002}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;font-weight:650;transition:.18s}button:hover{transform:translateY(-1px);filter:brightness(.98)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);padding:11px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}textarea{min-height:100px;resize:vertical}.primary{background:var(--brand);color:#fff}.softbtn{background:var(--brand-soft);color:var(--brand)}.quiet{background:transparent;border:1px solid var(--line);color:var(--muted)}.danger{background:#fff0f1;color:var(--red)}.hidden{display:none!important}.muted{color:var(--muted)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#aaa2ff 0,transparent 34%),linear-gradient(135deg,#29245e,#6256d9 55%,#27a995)}.authbox{width:min(420px,100%);background:white;color:#24243b;border-radius:24px;padding:30px;box-shadow:0 25px 70px #17134255}.authbox h1{margin:0;font-size:25px}.authbox p{color:#81869b}.authbox label{display:block;font-weight:650;font-size:13px;margin:13px 0 5px}.authbox input{background:#fff;color:#20243a}.authbox button{width:100%;margin-top:13px}.authswitch{background:transparent;color:#6558e8}
header{height:76px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 1300px)/2));position:sticky;top:0;z-index:4}.brand{display:flex;align-items:center;gap:11px}.brandmark{height:42px;width:42px;border-radius:14px;background:linear-gradient(135deg,var(--brand),#968cf9);color:#fff;display:grid;place-items:center;font-size:21px;box-shadow:0 6px 15px #6558e833}.brand h1{font-size:17px;margin:0;letter-spacing:-.3px}.brand small{display:block;color:var(--muted);font-size:11px}.headright{display:flex;align-items:center;gap:9px}.headright button{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800}
.shell{max-width:1300px;margin:0 auto;padding:25px 22px;display:grid;grid-template-columns:225px minmax(0,1fr);gap:25px}.sidebar{height:max-content;position:sticky;top:96px}.side-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:800;padding:13px 12px 7px}.nav{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;color:var(--muted);padding:12px;border-radius:12px;margin:2px 0}.nav .ico{width:22px;text-align:center;font-size:17px}.nav.active{background:var(--brand-soft);color:var(--brand);font-weight:750}.side-tip{margin-top:23px;background:linear-gradient(145deg,#e9e7ff,#f4f3ff);color:#49418e;border-radius:16px;padding:15px;font-size:12px}.side-tip b{display:block;font-size:13px;margin-bottom:5px}body.dark .side-tip{background:#302e55;color:#d8d4ff}
main{min-width:0}.page{animation:appear .22s ease}@keyframes appear{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin:4px 0 21px}.eyebrow{color:var(--brand);font-weight:800;text-transform:uppercase;letter-spacing:1.4px;font-size:10px}.pagehead h2{margin:3px 0 2px;font-size:27px;letter-spacing:-.8px}.pagehead p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:17px}.metric,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.metric{padding:17px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:75px;height:75px;border-radius:50%;right:-24px;top:-27px;background:var(--brand-soft)}.metric .micon{font-size:18px;position:relative;z-index:1}.metric strong{display:block;font-size:25px;letter-spacing:-.8px;margin:9px 0 1px}.metric span{font-size:12px;color:var(--muted)}.panel{padding:19px;margin-bottom:16px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.panelhead h3{margin:0;font-size:15px}.panelhead small{color:var(--muted)}.cols{display:grid;grid-template-columns:1.25fr .85fr;gap:16px}.row{display:flex;gap:10px;align-items:center}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 5px}.field.full{grid-column:1/-1}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--surface2)}.item .grow{flex:1;min-width:0}.item strong{display:block;overflow-wrap:anywhere}.item small{color:var(--muted)}.item.done strong{text-decoration:line-through;color:var(--muted)}.check{width:20px;height:20px;accent-color:var(--brand)}.tag{font-size:10px;font-weight:800;padding:4px 8px;border-radius:20px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}.tag.red{background:#fff0f1;color:var(--red)}.tag.green{background:#e7faf4;color:#159a7d}.actions{display:flex;gap:5px}.iconbtn{background:transparent;color:var(--muted);padding:6px 8px}.progress{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--teal));border-radius:9px}.empty{text-align:center;padding:28px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin:5px}.chart{height:190px;width:100%}.habitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.habit{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:14px}.habit .days{display:flex;gap:5px;margin-top:12px}.daydot{height:22px;width:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:10px;color:var(--muted)}.daydot.on{background:var(--teal);color:white}.notegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.note{padding:15px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);min-height:135px}.note h4{margin:0 0 7px}.note p{white-space:pre-wrap;color:var(--muted);margin:0 0 12px}.toast{position:fixed;right:22px;bottom:22px;background:#22243a;color:white;padding:12px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:20;animation:appear .2s}.barrow{display:grid;grid-template-columns:95px 1fr 75px;gap:10px;align-items:center;margin:12px 0;font-size:12px}.bar{height:9px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:8px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:15px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:4px;padding-bottom:5px}.side-label,.side-tip{display:none}.nav{width:auto;white-space:nowrap;padding:10px}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){header{padding:0 14px}.shell{padding:17px 13px}.cols{grid-template-columns:1fr}.grid{gap:9px}.metric{padding:13px}.metric strong{font-size:21px}.pagehead{align-items:flex-start;flex-direction:column}.fieldgrid{grid-template-columns:1fr}.headright .userlabel{display:none}.pagehead h2{font-size:24px}}
</style>
</head>
<body>
<section id="auth" class="auth"><div class="authbox">
<div class="brandmark" style="margin-bottom:18px">✦</div><h1 id="authTitle">Bem-vindo de volta</h1><p id="authDesc">Entre para acessar seu espaço de organização.</p>
<form id="authForm"><label>Seu nome</label><input id="authName" placeholder="Como podemos te chamar?" autocomplete="name" class="hidden"><label>E-mail</label><input id="authEmail" type="email" placeholder="voce@email.com" required autocomplete="username"><label>Senha</label><input id="authPass" type="password" placeholder="Mínimo de 4 caracteres" required minlength="4" autocomplete="current-password"><button class="primary" id="authSubmit">Entrar no meu espaço</button></form>
<button class="authswitch" id="authSwitch">Não tem uma conta? Criar agora</button><p style="font-size:11px;margin-top:18px">Demonstração local: seus dados ficam neste navegador.</p>
</div></section>
<div id="app" class="hidden">
<header><div class="brand"><div class="brandmark">✦</div><div><h1>Vida Fácil</h1><small>Seu espaço, sua rotina, seu ritmo.</small></div></div><div class="headright"><button id="themeBtn" title="Alternar tema">◐</button><button id="backupBtn" title="Exportar backup">⇩</button><span class="avatar" id="avatar">V</span><span class="userlabel" id="userLabel"></span><button id="logoutBtn" title="Sair">↪</button></div></header>
<div class="shell"><aside class="sidebar">
<div class="side-label">Visão geral</div><button class="nav active" data-page="home"><span class="ico">⌂</span>Início</button>
<div class="side-label">Organização</div><button class="nav" data-page="tasks"><span class="ico">☑</span>Tarefas</button><button class="nav" data-page="money"><span class="ico">◈</span>Finanças</button><button class="nav" data-page="habits"><span class="ico">◷</span>Hábitos</button><button class="nav" data-page="goals"><span class="ico">◎</span>Metas</button><button class="nav" data-page="notes"><span class="ico">▤</span>Anotações</button><button class="nav" data-page="achievements"><span class="ico">♜</span>Conquistas</button>
<div class="side-tip"><b>Um passo de cada vez ✨</b>Pequenas ações feitas com frequência constroem grandes mudanças.</div></aside><main id="main"></main></div>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const today=()=>new Date().toISOString().slice(0,10), money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let users=JSON.parse(localStorage.getItem('vf_users')||'{}'),current=null,data={},page='home',register=false;
const fresh=()=>({tasks:[],transactions:[],habits:[],goals:[],notes:[],achievements:[]});
function save(){if(current){localStorage.setItem('vf_data_'+current,JSON.stringify(data));}}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}
function escapeHTML(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#authSwitch').onclick=()=>{register=!register;$('#authTitle').textContent=register?'Crie seu espaço':'Bem-vindo de volta';$('#authDesc').textContent=register?'Seus dados serão salvos neste navegador.':'Entre para acessar seu espaço de organização.';$('#authName').classList.toggle('hidden',!register);$('#authName').required=register;$('#authPass').autocomplete=register?'new-password':'current-password';$('#authSubmit').textContent=register?'Criar minha conta':'Entrar no meu espaço';$('#authSwitch').textContent=register?'Já tem uma conta? Entrar':'Não tem uma conta? Criar agora'};
$('#authForm').onsubmit=e=>{e.preventDefault();let email=$('#authEmail').value.trim().toLowerCase(),pass=$('#authPass').value;if(register){if(users[email])return toast('Este e-mail já está cadastrado.');users[email]={pass,name:$('#authName').value.trim()||email.split('@')[0]};localStorage.setItem('vf_users',JSON.stringify(users));toast('Conta criada!');}else if(!users[email]||users[email].pass!==pass)return toast('E-mail ou senha incorretos.');login(email)};
function login(email){current=email;data=JSON.parse(localStorage.getItem('vf_data_'+current)||'null')||fresh();$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#userLabel').textContent=users[email].name;$('#avatar').textContent=users[email].name.charAt(0).toUpperCase();render()}
$('#logoutBtn').onclick=()=>{save();current=null;$('#app').classList.add('hidden');$('#auth').classList.remove('hidden');$('#authForm').reset()};
$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('vf_theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('vf_theme')==='dark')document.body.classList.add('dark');
$$('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;$$('.nav').forEach(n=>n.classList.toggle('active',n===b));render()});
function head(k,t,d,btn=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h2>${t}</h2><p>${d}</p></div>${btn}</div>`}
function panel(t,body,extra=''){return `<section class="panel"><div class="panelhead"><h3>${t}</h3>${extra}</div>${body}</section>`}
function metric(icon,label,value,sub){return `<div class="metric"><span class="micon">${icon}</span><strong>${value}</strong><span>${label} · ${sub}</span></div>`}
function render(){save();let done=data.tasks.filter(x=>x.done).length,open=data.tasks.length-done,income=data.transactions.filter(x=>x.type==='in').reduce((a,x)=>a+x.amount,0),out=data.transactions.filter(x=>x.type==='out').reduce((a,x)=>a+x.amount,0),balance=income-out;
let content='';
if(page==='home'){let urgent=data.tasks.filter(x=>!x.done&&x.date===today()).slice(0,5);content=head('PAINEL PESSOAL',`Olá, ${escapeHTML(users[current].name)}! 👋`,'Aqui está um resumo do seu dia. Organize o que importa e avance no seu ritmo.',`<button class="primary" onclick="go('tasks')">＋ Nova tarefa</button>`)+`<div class="grid">${metric('☑','Tarefas pendentes',open,done+' concluídas')}${metric('◈','Saldo registrado',money(balance),'receitas menos despesas')}${metric('◷','Hábitos criados',data.habits.length,'na sua rotina')}${metric('◎','Metas em andamento',data.goals.filter(g=>g.current<g.target).length,'objetivos ativos')}</div><div class="cols">${panel('Tarefas para hoje',urgent.length?`<div class="list">${urgent.map(taskHTML).join('')}</div>`:`<div class="empty">🌤️<b>Dia livre por enquanto</b>Adicione uma tarefa para começar.</div>`,`<button class="softbtn" onclick="go('tasks')">Ver todas</button>`)}${panel('Seu progresso',`<p class="muted">Tarefas concluídas</p><div class="row" style="justify-content:space-between"><b style="font-size:27px">${data.tasks.length?Math.round(done/data.tasks.length*100):0}%</b><span class="muted">${done} de ${data.tasks.length}</span></div><div class="progress"><span style="width:${data.tasks.length?done/data.tasks.length*100:0}%"></span></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><p class="muted">Resumo financeiro</p><div class="row" style="justify-content:space-between"><span>Entradas</span><b style="color:var(--teal)">${money(income)}</b></div><div class="row" style="justify-content:space-between"><span>Saídas</span><b style="color:var(--red)">${money(out)}</b></div><div class="row" style="justify-content:space-between"><span>Saldo</span><b>${money(balance)}</b></div>`)} </div>${panel('Acesso rápido',`<div class="row" style="flex-wrap:wrap"><button class="softbtn" onclick="go('money')">＋ Lançamento financeiro</button><button class="softbtn" onclick="go('habits')">＋ Novo hábito</button><button class="softbtn" onclick="go('goals')">＋ Nova meta</button><button class="softbtn" onclick="go('notes')">＋ Anotação</button></div>`)}`;
}
if(page==='tasks'){content=head('ORGANIZAÇÃO','Minhas tarefas','Planeje, priorize e acompanhe o que precisa ser feito.',`<button class="primary" onclick="showForm('taskForm')">＋ Adicionar tarefa</button>`)+panel('Lista de tarefas',`<div class="row" style="margin-bottom:13px;flex-wrap:wrap"><input id="taskSearch" placeholder="Buscar tarefa..." style="max-width:260px" oninput="renderTasks()"><select id="taskFilter" style="max-width:180px" onchange="renderTasks()"><option value="all">Todas</option><option value="open">Pendentes</option><option value="done">Concluídas</option></select></div><div id="taskList" class="list"></div>`)+panel('Nova tarefa',`<form id="taskForm" class="hidden"><div class="fieldgrid"><div class="field full"><label>Título</label><input name="title" required placeholder="Ex.: Estudar programação"></div><div class="field"><label>Data</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Prioridade</label><select name="priority"><option>Normal</option><option>Alta</option><option>Baixa</option></select></div><div class="field"><label>Categoria</label><select name="category"><option>Pessoal</option><option>Trabalho</option><option>Estudos</option><option>Casa</option><option>Saúde</option></select></div><div class="field"><label>Horário</label><input name="time" type="time"></div></div><div class="formactions"><button type="button" class="quiet" onclick="hideForm('taskForm')">Cancelar</button><button class="primary">Salvar tarefa</button></div></form>`)}
if(page==='money'){content=head('CONTROLE FINANCEIRO','Minhas finanças','Registre entradas e despesas para entender seu dinheiro.',`<button class="primary" onclick="showForm('moneyForm')">＋ Novo lançamento</button>`)+`<div class="grid">${metric('↗','Receitas',money(income),'total registrado')}${metric('↘','Despesas',money(out),'total registrado')}${metric('◈','Saldo',money(balance),'resultado atual')}${metric('▤','Lançamentos',data.transactions.length,'registros')}</div>`+panel('Movimentações',`<div class="list">${data.transactions.length?[...data.transactions].reverse().map((x,i)=>`<div class="item"><div class="grow"><strong>${escapeHTML(x.title)}</strong><small>${x.date} · ${x.category}</small></div><b style="color:${x.type==='in'?'var(--teal)':'var(--red)'}">${x.type==='in'?'+':'−'} ${money(x.amount)}</b><button class="iconbtn" onclick="del('transactions',${data.transactions.length-1-i})">✕</button></div>`).join(''):'<div class="empty">Nenhum lançamento registrado ainda.</div>'}</div>`)+panel('Adicionar lançamento',`<form id="moneyForm" class="hidden"><div class="fieldgrid"><div class="field full"><label>Descrição</label><input name="title" required placeholder="Ex.: Salário, mercado..."></div><div class="field"><label>Valor (R$)</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Tipo</label><select name="type"><option value="out">Despesa</option><option value="in">Receita</option></select></div><div class="field"><label>Categoria</label><select name="category"><option>Alimentação</option><option>Moradia</option><option>Transporte</option><option>Saúde</option><option>Lazer</option><option>Salário</option><option>Outros</option></select></div><div class="field"><label>Data</label><input name="date" type="date" value="${today()}"></div></div><div class="formactions"><button type="button" class="quiet" onclick="hideForm('moneyForm')">Cancelar</button><button class="primary">Salvar</button></div></form>`)}
if(page==='habits'){content=head('ROTINA E CONSISTÊNCIA','Meus hábitos','Pequenas ações repetidas criam grandes resultados.',`<button class="primary" onclick="showForm('habitForm')">＋ Criar hábito</button>`)+panel('Acompanhamento',`<div class="habitgrid">${data.habits.length?data.habits.map((h,i)=>`<div class="habit"><div class="row"><b style="flex:1">${escapeHTML(h.name)}</b><button class="iconbtn" onclick="del('habits',${i})">✕</button></div><p class="muted" style="margin:5px 0">${escapeHTML(h.desc||'Um dia de cada vez.')}</p><div class="row" style="justify-content:space-between"><small>Hoje</small><button class="${h.days.includes(today())?'primary':'softbtn'}" onclick="toggleHabit(${i})">${h.days.includes(today())?'✓ Feito':'Marcar feito'}</button></div><small class="muted">${h.days.length} dias registrados</small></div>`).join(''):'<div class="empty">🌱<b>Comece com um hábito simples</b>Ex.: beber água, caminhar ou ler.</div>'}</div>`)+panel('Novo hábito',`<form id="habitForm" class="hidden"><div class="fieldgrid"><div class="field"><label>Nome do hábito</label><input name="name" required placeholder="Ex.: Ler 10 páginas"></div><div class="field"><label>Descrição (opcional)</label><input name="desc" placeholder="Por que isso é importante?"></div></div><div class="formactions"><button type="button" class="quiet" onclick="hideForm('habitForm')">Cancelar</button><button class="primary">Criar hábito</button></div></form>`)}
if(page==='goals'){content=head('PLANOS E OBJETIVOS','Minhas metas','Transforme planos em passos que você consegue acompanhar.',`<button class="primary" onclick="showForm('goalForm')">＋ Nova meta</button>`)+panel('Metas em andamento',`<div class="list">${data.goals.length?data.goals.map((g,i)=>`<div class="item"><div class="grow"><strong>${escapeHTML(g.name)}</strong><small>${g.current} de ${g.target} ${escapeHTML(g.unit)}</small><div class="progress" style="margin-top:8px"><span style="width:${Math.min(100,g.current/g.target*100)}%"></span></div></div><button class="softbtn" onclick="goalAdd(${i})">＋ Progresso</button><button class="iconbtn" onclick="del('goals',${i})">✕</button></div>`).join(''):'<div class="empty">◎<b>Qual é seu próximo objetivo?</b>Crie uma meta e acompanhe sua evolução.</div>'}</div>`)+panel('Criar meta',`<form id="goalForm" class="hidden"><div class="fieldgrid"><div class="field full"><label>Nome da meta</label><input name="name" required placeholder="Ex.: Guardar dinheiro para viajar"></div><div class="field"><label>Objetivo total</label><input name="target" type="number" min="1" required></div><div class="field"><label>Unidade</label><input name="unit" placeholder="R$, páginas, km..." required></div></div><div class="formactions"><button type="button" class="quiet" onclick="hideForm('goalForm')">Cancelar</button><button class="primary">Criar meta</button></div></form>`)}
if(page==='notes'){content=head('IDEIAS E REGISTROS','Minhas anotações','Guarde ideias, lembretes e informações importantes.',`<button class="primary" onclick="showForm('noteForm')">＋ Nova anotação</button>`)+panel('Anotações',`<div class="notegrid">${data.notes.length?data.notes.map((n,i)=>`<article class="note"><div class="row"><h4 style="flex:1">${escapeHTML(n.title)}</h4><button class="iconbtn" onclick="del('notes',${i})">✕</button></div><p>${escapeHTML(n.body)}</p><small class="muted">${n.date}</small></article>`).join(''):'<div class="empty">▤<b>Seu espaço de ideias está vazio</b>Registre aqui o que não quer esquecer.</div>'}</div>`)+panel('Nova anotação',`<form id="noteForm" class="hidden"><div class="field"><label>Título</label><input name="title" required></div><div class="field" style="margin-top:10px"><label>Texto</label><textarea name="body" required placeholder="Escreva sua ideia..."></textarea></div><div class="formactions"><button type="button" class="quiet" onclick="hideForm('noteForm')">Cancelar</button><button class="primary">Salvar anotação</button></div></form>`)}
if(page==='achievements'){
let stats={tasks:data.tasks.length,done:data.tasks.filter(t=>t.done).length,transactions:data.transactions.length,notes:data.notes.length,goals:data.goals.length,habits:data.habits.length,habitDays:data.habits.reduce((a,h)=>a+h.days.length,0),income:data.transactions.filter(t=>t.type==='in').length,expenses:data.transactions.filter(t=>t.type==='out').length,highDone:data.tasks.filter(t=>t.done&&t.priority==='Alta').length,dated:data.tasks.filter(t=>t.date).length};
let special=[['Primeiro passo','Crie sua primeira tarefa',stats.tasks>0,'☑'],['Organização em dia','Conclua 5 tarefas',stats.done>=5,'🏅'],['Planejador','Crie sua primeira meta',stats.goals>0,'◎'],['Rotina saudável','Registre um hábito',stats.habits>0,'🌱'],['Controle financeiro','Faça seu primeiro lançamento',stats.transactions>0,'◈'],['Caderno aberto','Salve uma anotação',stats.notes>0,'▤']];
let tiers=[
{name:'Fácil',color:'#20b89a',icon:'🌱',thresholds:[1,2,3,4,5]},
{name:'Médio',color:'#5689e8',icon:'⚡',thresholds:[6,8,10,12,15]},
{name:'Difícil',color:'#d58a36',icon:'🔥',thresholds:[20,25,30,40,50]},
{name:'Muito difícil',color:'#a56be0',icon:'💎',thresholds:[60,75,100,150,200]}
];
let families=[
['tarefas criadas','tasks','📝','Crie {n} tarefas'],
['tarefas concluídas','done','☑','Conclua {n} tarefas'],
['movimentações financeiras','transactions','💳','Registre {n} movimentações'],
['anotações salvas','notes','📚','Salve {n} anotações'],
['dias de hábitos registrados','habitDays','🔥','Some {n} registros de hábitos'],
['metas criadas','goals','🎯','Crie {n} metas'],
['hábitos criados','habits','🌿','Cadastre {n} hábitos'],
['receitas registradas','income','💰','Registre {n} receitas'],
['despesas registradas','expenses','🧾','Registre {n} despesas'],
['tarefas de alta prioridade concluídas','highDone','🚀','Conclua {n} tarefas de alta prioridade'],
['tarefas com data definida','dated','📅','Planeje {n} tarefas com data']
];
let bonus=[];
tiers.forEach((tier,ti)=>{for(let j=0;j<25;j++){let family=families[(j+ti*3)%families.length],step=tier.thresholds[j%5],stat=family[1];bonus.push({name:`${family[0][0].toUpperCase()+family[0].slice(1)} ${step}`,desc:family[3].replace('{n}',step),ok:stats[stat]>=step,icon:family[2],level:tier.name,color:tier.color,progress:Math.min(100,stats[stat]/step*100),current:stats[stat],target:step})}});
let unlocked=special.filter(x=>x[2]).length+bonus.filter(x=>x.ok).length,total=special.length+bonus.length;
let specialHTML=special.map(x=>`<div class="habit" style="opacity:${x[2]?1:.58}"><div style="font-size:26px">${x[3]}</div><b>${x[0]}</b><p class="muted">${x[1]}</p><span class="tag ${x[2]?'green':''}">${x[2]?'Desbloqueada':'Bloqueada'}</span></div>`).join('');
let bonusHTML=tiers.map(tier=>{let group=bonus.filter(x=>x.level===tier.name),count=group.filter(x=>x.ok).length;return `<section class="panel"><div class="panelhead"><div><h3>${tier.icon} Nível ${tier.name}</h3><small>${count} de 25 conquistas desbloqueadas</small></div><span class="tag" style="background:${tier.color}20;color:${tier.color}">${Math.round(count/25*100)}%</span></div><div class="progress" style="margin-bottom:15px"><span style="width:${count/25*100}%;background:${tier.color}"></span></div><div class="habitgrid">${group.map(x=>`<div class="habit" style="opacity:${x.ok?1:.66};border-color:${x.ok?tier.color+'88':'var(--line)'}"><div class="row"><span style="font-size:24px">${x.icon}</span><span class="tag" style="margin-left:auto;background:${tier.color}20;color:${tier.color}">${tier.name}</span></div><b style="display:block;margin-top:9px">${x.name}</b><p class="muted" style="min-height:36px">${x.desc}</p><div class="progress"><span style="width:${x.progress}%;background:${tier.color}"></span></div><small class="muted">${Math.min(x.current,x.target)} / ${x.target} · ${x.ok?'Conquistada':'Em progresso'}</small></div>`).join('')}</div></section>`}).join('');
content=head('SUAS VITÓRIAS','106 conquistas','6 conquistas especiais + 100 desafios divididos em quatro níveis. Cada ação conta!')+`<div class="grid">${metric('🏆','Conquistas liberadas',unlocked,'de '+total+' disponíveis')}${metric('🌱','Nível fácil',bonus.filter(x=>x.level==='Fácil'&&x.ok).length,'de 25 conquistadas')}${metric('🔥','Nível difícil',bonus.filter(x=>x.level==='Difícil'&&x.ok).length,'de 25 conquistadas')}${metric('💎','Muito difícil',bonus.filter(x=>x.level==='Muito difícil'&&x.ok).length,'de 25 conquistadas')}</div>`+panel('Conquistas especiais',`<div class="habitgrid">${specialHTML}</div>`)+bonusHTML
}
$('#main').innerHTML=`<div class="page">${content}<div class="footer">Vida Fácil • Feito para deixar sua rotina mais leve</div></div>`;
bindForms();if(page==='tasks')renderTasks();
}
function taskHTML(t){let i=data.tasks.indexOf(t);return `<div class="item ${t.done?'done':''}"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})"><div class="grow"><strong>${escapeHTML(t.title)}</strong><small>${t.date||'Sem data'} ${t.time?'· '+t.time:''} · ${escapeHTML(t.category)}</small></div><span class="tag ${t.priority==='Alta'?'red':''}">${t.priority}</span><button class="iconbtn" onclick="del('tasks',${i})">✕</button></div>`}
function renderTasks(){let q=($('#taskSearch')?.value||'').toLowerCase(),f=$('#taskFilter')?.value||'all';let arr=data.tasks.filter(t=>t.title.toLowerCase().includes(q)&&(f==='all'||(f==='done'?t.done:!t.done)));$('#taskList').innerHTML=arr.length?arr.map(taskHTML).join(''):'<div class="empty">Nenhuma tarefa encontrada.</div>'}
function bindForms(){let specs={taskForm:f=>data.tasks.push({...f,done:false}),moneyForm:f=>data.transactions.push({...f,amount:Number(f.amount)}),habitForm:f=>data.habits.push({...f,days:[]}),goalForm:f=>data.goals.push({...f,target:Number(f.target),current:0}),noteForm:f=>data.notes.push({...f,date:today()})};Object.entries(specs).forEach(([id,fn])=>{let form=$('#'+id);if(form)form.onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(form)));save();toast('Salvo com sucesso!');render()}})}
function showForm(id){let e=$('#'+id);e.classList.remove('hidden');e.scrollIntoView({behavior:'smooth',block:'center'})}function hideForm(id){$('#'+id).classList.add('hidden')}
function toggleTask(i){data.tasks[i].done=!data.tasks[i].done;save();render()}
function toggleHabit(i){let a=data.habits[i].days,k=today();data.habits[i].days=a.includes(k)?a.filter(x=>x!==k):[...a,k];save();render()}
function goalAdd(i){let v=prompt('Quanto deseja adicionar ao progresso?');if(v!==null&&Number(v)>0){data.goals[i].current=Math.min(data.goals[i].target,data.goals[i].current+Number(v));save();render()}}
function del(type,i){if(confirm('Deseja excluir este registro?')){data[type].splice(i,1);save();render();toast('Registro excluído.')}}function go(p){page=p;$$('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));render()}
$('#backupBtn').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vida-facil-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exportado!')};
</script>
</body></html>
